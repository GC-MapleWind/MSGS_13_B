name: dpbr-main

services:
  postgres:
    image: postgres:17-alpine
    container_name: dpbr-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    volumes:
      - ./data/pg:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-init:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command:
      - sh
      - -c
      - |
        set -e
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        psql -h postgres -U "$${POSTGRES_USER}" -d postgres <<'SQL'
        SELECT 'CREATE DATABASE maplewind'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'maplewind')\gexec
        SELECT 'CREATE DATABASE chatbot'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'chatbot')\gexec
        SQL
    restart: "no"

  backend:
    image: ghcr.io/gc-maplewind/msgs_13_b-backend:latest
    container_name: dpbr-backend
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8013:8000"
    volumes:
      - ./13기 메생결산:/app/init.d:ro
      - ./avatars:/app/avatars:ro
      - ./media:/app/media
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn src.main:app --host 0.0.0.0 --port 8000"]
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/maplewind
      INIT_DATA_DIR: /app/init.d
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      API_ROOT_PATH: ${API_ROOT_PATH:-}
      API_DOCS_URL: ${API_DOCS_URL:-/docs}
      API_REDOC_URL: ${API_REDOC_URL:-/redoc}
      API_OPENAPI_URL: ${API_OPENAPI_URL:-/openapi.json}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  chatbot:
    image: ghcr.io/gc-maplewind/maplewind-chatbot:latest
    container_name: maplewind-chatbot
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8014:8000"
    volumes:
      - ../google-credentials.json:/app/google-credentials.json:ro
    environment:
      ENVIRONMENT: production
      CHATBOT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/chatbot
      ADMIN_SESSION_SECRET: ${CHATBOT_ADMIN_SESSION_SECRET:?CHATBOT_ADMIN_SESSION_SECRET is required}
      ADMIN_USERNAME: ${CHATBOT_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${CHATBOT_ADMIN_PASSWORD:?CHATBOT_ADMIN_PASSWORD is required}
      ALLOWED_ORIGINS: ${CHATBOT_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CHATBOT_AUTHORIZATION_KEY: ${CHATBOT_AUTHORIZATION_KEY:?CHATBOT_AUTHORIZATION_KEY is required}
      GOOGLE_CREDENTIALS_PATH: ${GOOGLE_CREDENTIALS_PATH:-google-credentials.json}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:?GOOGLE_DRIVE_ROOT_FOLDER_ID is required}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      AUTO_CREATE_TABLES: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
