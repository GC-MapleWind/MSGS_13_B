name: dpbr-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: dpbr-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maplewind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maplewind}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5413:5432"
    volumes:
      - ./data/pg-dev:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-maplewind} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-init:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maplewind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maplewind}
    command:
      - sh
      - -c
      - |
        set -e
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        psql -h postgres -U "$${POSTGRES_USER}" -d postgres <<'SQL'
        SELECT 'CREATE DATABASE maplewind'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'maplewind')\gexec
        SELECT 'CREATE DATABASE chatbot'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'chatbot')\gexec
        SQL
    restart: "no"

  backend:
    image: ghcr.io/gc-maplewind/msgs_13_b-backend:dev
    container_name: dpbr-backend-dev
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./13기 메생결산:/app/13기 메생결산:ro
      - ./avatars:/app/avatars:ro
      - ./media:/app/media
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn src.main:app --host 0.0.0.0 --port 8000"]
    environment:
      ENVIRONMENT: development
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maplewind}:${POSTGRES_PASSWORD:-maplewind}@postgres:5432/maplewind
      INIT_DATA_DIR: /app/13기 메생결산
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is not set}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is not set}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is not set}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      API_ROOT_PATH: ${API_ROOT_PATH:-}
      API_DOCS_URL: ${API_DOCS_URL:-/docs}
      API_REDOC_URL: ${API_REDOC_URL:-/redoc}
      API_OPENAPI_URL: ${API_OPENAPI_URL:-/openapi.json}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
