name: dpbr-dev

services:
  backend:
    image: ghcr.io/gc-maplewind/msgs_13_b-backend:dev
    container_name: dpbr-backend-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./maplewind.db:/app/data/maplewind.db
      - ./13기 메생결산:/app/13기 메생결산:ro
      - ./avatars:/app/avatars:ro
    command: ["uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:////app/data/maplewind.db
      - INIT_DATA_DIR=/app/13기 메생결산
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is not set}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is not set}
      - API_V1_PREFIX=${API_V1_PREFIX:-/api/v1}
      - API_ROOT_PATH=${API_ROOT_PATH:-}
      - API_DOCS_URL=${API_DOCS_URL:-/docs}
      - API_REDOC_URL=${API_REDOC_URL:-/redoc}
      - API_OPENAPI_URL=${API_OPENAPI_URL:-/openapi.json}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
